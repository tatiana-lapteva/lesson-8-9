apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 1.6.2
    helm:
      releaseName: mlflow
      valuesObject:
        service:
          type: ClusterIP
          port: 5000
        auth:
          enabled: false
        # postgresql:
        #   enabled: false
        backendStore:
          databaseMigration: true
          databaseConnectionCheck: true
          postgres:
            enabled: true
            host: mlflow-postgres-postgresql.application.svc.cluster.local
            port: 5432
            database: mlflow
            user: mlflow
            password: mlflowpass

        artifactRoot:
          s3:
            enabled: true
            bucket: mlflow-artifacts
            awsAccessKeyId: minio
            awsSecretAccessKey: minio123

        extraEnvVars:
          # AWS_ACCESS_KEY_ID: "minio"
          # AWS_SECRET_ACCESS_KEY: "minio123"
          MLFLOW_S3_ENDPOINT_URL: "http://minio.application.svc.cluster.local:9000"
          # MLFLOW_BACKEND_STORE_URI: "postgresql://mlflow:mlflowpass@mlflow-postgres-postgresql.application.svc.cluster.local:5432/mlflow"
          # MLFLOW_ARTIFACT_ROOT: "s3://mlflow-artifacts"
          MLFLOW_S3_IGNORE_TLS: "true"

        # extraArgs:
        #   backend-store-uri: "$(MLFLOW_BACKEND_STORE_URI)"
        #   default-artifact-root: "$(MLFLOW_ARTIFACT_ROOT)"
        #   host: "0.0.0.0"
        #   port: "5000"

  destination:
    namespace: application
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true


